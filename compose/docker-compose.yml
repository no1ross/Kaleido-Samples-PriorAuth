services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"

  eventcollector:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/EventCollector/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventCollector: Data Source=/app/data/eventcollector.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-eventcollector
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8086:8080"

  referencedata:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/Services/ReferenceData/Dockerfile
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ReferenceData: Data Source=/app/data/referencedata.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-referencedata
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
