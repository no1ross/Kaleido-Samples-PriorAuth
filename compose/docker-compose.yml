services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"

  eventcollector:
    build:
      context: ..
      dockerfile: src/EventCollector/Dockerfile
      secrets:
        - nuget_token
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventCollector: Data Source=/app/data/eventcollector.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8086:8080"

  referencedata:
    build:
      context: ..
      dockerfile: src/Services/ReferenceData/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ReferenceData: Data Source=/app/data/referencedata.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8081:8080"

  codeset:
    build:
      context: ..
      dockerfile: src/Services/CodeSet/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CodeSet: Data Source=/app/data/codeset.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8082:8080"

  configuration:
    build:
      context: ..
      dockerfile: src/Services/Configuration/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Configuration: Data Source=/app/data/configuration.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8087:8080"

  provider:
    build:
      context: ..
      dockerfile: src/Services/Provider/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Provider: Data Source=/app/data/provider.db
      Kaleido__BaseUrl: http://router:8080
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8083:8080"

  member:
    build:
      context: ..
      dockerfile: src/Services/Member/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Member: Data Source=/app/data/member.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8084:8080"

  history:
    build:
      context: ..
      dockerfile: src/Services/History/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__History: Data Source=/app/data/history.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8089:8080"

  router:
    build:
      context: ..
      dockerfile: src/Router/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      referencedata:
        condition: service_healthy
      codeset:
        condition: service_healthy
      member:
        condition: service_healthy
      history:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8080:8080"

  intake:
    build:
      context: ..
      dockerfile: src/Services/Intake/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      router:
        condition: service_healthy
      radiology:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Intake: Data Source=/app/data/intake.db
      ConnectionStrings__IntakeProcess: Data Source=/app/data/intake-process.db
      Kaleido__BaseUrl: http://router:8080
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8085:8080"

  radiology:
    build:
      context: ..
      dockerfile: src/Services/Radiology/Dockerfile
      secrets:
        - nuget_token
    depends_on:
      router:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Radiology: Data Source=/app/data/radiology.db
      ConnectionStrings__RadiologyProcess: Data Source=/app/data/radiology-process.db
      Kaleido__BaseUrl: http://router:8080
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8088:8080"

# The Kaleido packages come from its GitHub Packages feed: images restore them with this token,
# a build secret (never in an image layer). Set KALEIDO_FEED_TOKEN to a GitHub token with
# read:packages before building (README, "Run it").
secrets:
  nuget_token:
    environment: KALEIDO_FEED_TOKEN
