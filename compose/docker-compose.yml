services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"

  eventcollector:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/EventCollector/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventCollector: Data Source=/app/data/eventcollector.db
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-eventcollector
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-eventcollector
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8086:8080"

  referencedata:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/ReferenceData/Dockerfile
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ReferenceData: Data Source=/app/data/referencedata.db
      Services__EventCollector__BaseUrl: http://eventcollector:8080
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-referencedata
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-referencedata
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8081:8080"

  codeset:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/CodeSet/Dockerfile
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CodeSet: Data Source=/app/data/codeset.db
      Services__EventCollector__BaseUrl: http://eventcollector:8080
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-codeset
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-codeset
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8082:8080"

  configuration:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/Configuration/Dockerfile
    depends_on:
      eventcollector:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Configuration: Data Source=/app/data/configuration.db
      Services__EventCollector__BaseUrl: http://eventcollector:8080
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-configuration
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-configuration
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8087:8080"

  providersearch:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/ProviderSearch/Dockerfile
    depends_on:
      eventcollector:
        condition: service_healthy
      referencedata:
        condition: service_healthy
      codeset:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProviderSearch: Data Source=/app/data/providersearch.db
      Services__EventCollector__BaseUrl: http://eventcollector:8080
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-providersearch
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-providersearch
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8083:8080"

  memberservice:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/MemberService/Dockerfile
    depends_on:
      eventcollector:
        condition: service_healthy
      referencedata:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MemberService: Data Source=/app/data/memberservice.db
      Services__EventCollector__BaseUrl: http://eventcollector:8080
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-memberservice
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-memberservice
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8084:8080"

  intake:
    build:
      context: ../../..
      dockerfile: samples/PriorAuth/Intake/Dockerfile
    depends_on:
      memberservice:
        condition: service_healthy
      providersearch:
        condition: service_healthy
      referencedata:
        condition: service_healthy
      codeset:
        condition: service_healthy
      configuration:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Intake: Data Source=/app/data/intake.db
      ConnectionStrings__IntakeProcess: Data Source=/app/data/intake-process.db
      Services__ReferenceData__BaseUrl: http://referencedata:8080
      Services__MemberService__BaseUrl: http://memberservice:8080
      Services__CodeSet__BaseUrl: http://codeset:8080
      Services__Configuration__BaseUrl: http://configuration:8080
      Services__EventCollector__BaseUrl: http://eventcollector:8080
      OpenTelemetry__Endpoint: http://aspire-dashboard:18889
      OpenTelemetry__Protocol: grpc
      OpenTelemetry__ServiceName: priorauth-intake
      OpenTelemetry__ResourceAttributes: deployment.environment=Development,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: priorauth-intake
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=Development,service.version=1.0.0
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8085:8080"

  priorauth-ui:
    build:
      context: ../priorauth-ui
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: container

  router:
    image: nginx:1.29-alpine
    depends_on:
      referencedata:
        condition: service_healthy
      codeset:
        condition: service_healthy
      providersearch:
        condition: service_healthy
      memberservice:
        condition: service_healthy
      intake:
        condition: service_healthy
      priorauth-ui:
        condition: service_started
    volumes:
      - ./router.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"

