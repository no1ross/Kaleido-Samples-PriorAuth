<section class="process-step-card">
  <header class="process-step-card__header">
    <div>
      <div class="process-step-card__eyebrow">MRI Information</div>
      <h2>{{ informationRequest()?.title ?? 'Capture MRI details' }}</h2>
    </div>
  </header>

  <div class="process-step-card__body">
    @if (informationRequest(); as request) {
      <priorauth-information-request-form
        [request]="request"
        submitLabel="Submit MRI Information"
        [isSubmitting]="isSubmitting()"
        (submitted)="submit($event)" />
    } @else {
      <p class="process-step-card__error">There are no MRI questions pending for this process.</p>
    }

    @if (errorMessage()) {
      <p class="process-step-card__error">{{ errorMessage() }}</p>
    }
  </div>
</section>
