<div class="shell" [class.shell--process]="isProcessRoute()">
  @if (!isProcessRoute()) {
    <header class="shell__header">
      <div>
        <h1>{{ title() }}</h1>
        <p>Prior authorization process scaffolding with registry diagnostics.</p>
      </div>

      <div class="shell__persona">
        <label for="persona-picker">Persona</label>
        <!-- [selected] per option, not [value] on the select: the options are rendered after the
             select's value is bound, so a restored persona would show as "Anonymous" while its
             token is still sent. -->
        <select id="persona-picker" (change)="onPersonaChange($event)">
          <option value="" [selected]="!auth.persona()">Anonymous</option>
          @for (persona of auth.personas; track persona.name) {
            <option [value]="persona.name" [selected]="persona.name === auth.persona()">{{ persona.displayName }}</option>
          }
        </select>
      </div>

      @if (processId()) {
        <div class="shell__process-id">
          <div class="shell__process-id-header">
            <span>Process ID</span>
            <button type="button" class="shell__exit-process" (click)="exitProcess()">Exit process</button>
          </div>
          <strong>{{ processId() }}</strong>
        </div>
      }

      <nav class="shell__nav">
        <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="is-active">Home</a>
        <a routerLink="/events" routerLinkActive="is-active">Events</a>
        <a routerLink="/registries/process" routerLinkActive="is-active">Process Registries</a>
        <a routerLink="/registries/queryable" routerLinkActive="is-active">Queryable Registries</a>
      </nav>
    </header>
  }

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
